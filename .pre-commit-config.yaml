repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-format
        name: ruff format check (backend)
        entry: ruff format --check .
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-lint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-build
        name: build & typecheck (frontend)
        entry: bash -c 'cd frontend && npm run build'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
