name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      model_override:
        description: 'Optional OPENROUTER_GENERATION_MODEL override for this run'
        required: false
        type: string

jobs:
  backend-eval:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run DeepEval pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          MONGODB_COLLECTION_CHUNKS: ${{ secrets.MONGODB_COLLECTION_CHUNKS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_GENERATION_MODEL: ${{ github.event.inputs.model_override || secrets.OPENROUTER_GENERATION_MODEL }}
          OPENROUTER_REWRITER_MODEL: ${{ secrets.OPENROUTER_REWRITER_MODEL }}
          OPENROUTER_EVAL_JUDGE_MODEL: ${{ secrets.OPENROUTER_EVAL_JUDGE_MODEL }}
          JWT_SECRET: test-secret
          JWT_EXPIRY_MINUTES: "10080"
          FRONTEND_ORIGIN: http://localhost:5174
          EMAIL_PROVIDER: resend
          EMAIL_API_KEY: test-key
          EMAIL_FROM: test@example.com
          OTP_TTL_MINUTES: "10"
          OTP_MAX_ATTEMPTS: "5"
          OTP_RESEND_COOLDOWN_SECONDS: "60"
          OTP_CODE_LENGTH: "6"
          POSTGRES_URI: postgresql://localhost:5432/postgres
          MONTHLY_SPEND_CAP_USD: "5"
          USER_MONTHLY_QUOTA_TOKENS: "50000"
          REDIS_URI: redis://localhost:6379
          RATE_LIMIT_REQUESTS: "5"
          RATE_LIMIT_WINDOW_SECONDS: "60"
        run: python scripts/run_eval.py
      - name: Report eval results
        if: always()
        run: echo "Eval metrics — check job logs for hard-gate (Answer Relevancy, Faithfulness) and soft-gate (Contextual Precision/Recall/Relevancy) results"

  deploy:
    needs: backend-eval
    runs-on: ubuntu-latest
    if: >
      needs.backend-eval.result == 'success' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Trigger Render backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

      - name: Trigger Render frontend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
